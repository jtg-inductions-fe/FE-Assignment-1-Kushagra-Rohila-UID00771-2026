<!doctype html>
<html lang="en">
    <head>
        <title>AluraBooks</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/assets/Logo.svg" />
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>

    <body>
        <div class="page-container">
            <noscript>
                This site requires JavaScript to function fully. Please enable
                it in your browser.
            </noscript>

            <header class="header">
                <button class="header__menu" id="menuToggle">
                    <span class="icon-font text--lg">&#xf006;</span>
                </button>
                <nav class="dropdown-menu" id="categoriesMenu">
                    <ul class="dropdown-menu__list">
                        <li class="dropdown-menu__title text--sm text--bold">
                            Categories
                        </li>
                        <li class="dropdown-menu__item">
                            <a href="#" class="dropdown-menu__link"
                                >PROGRAMMING</a
                            >
                        </li>
                        <li class="dropdown-menu__item">
                            <a href="#" class="dropdown-menu__link"
                                >FRONT-END</a
                            >
                        </li>
                        <li class="dropdown-menu__item">
                            <a href="#" class="dropdown-menu__link"
                                >INFRASTRUCTURE</a
                            >
                        </li>
                        <li class="dropdown-menu__item">
                            <a href="#" class="dropdown-menu__link">BUSINESS</a>
                        </li>
                        <li class="dropdown-menu__item">
                            <a href="#" class="dropdown-menu__link"
                                >DESIGN & UX</a
                            >
                        </li>
                    </ul>
                </nav>

                <div class="header__inner">
                    <a href="/" class="header__brand">
                        <img
                            class="header__logo-img"
                            src="/assets/Logo.svg"
                            alt="Logo"
                        />
                        <div class="header__title text--xl">
                            <span class="text--bold text--lg">Alura</span>Books
                        </div>
                    </a>
                    <nav class="header__navbar">
                        <ul class="header__list">
                            <div id="categoryWrapper">
                                <li>
                                    <button
                                        id="categoriesToggle"
                                        class="header__button"
                                    >
                                        CATEGORIES
                                    </button>
                                </li>
                                <ul
                                    class="dropdown-category__list"
                                    id="categoryList"
                                >
                                    <li class="dropdown-category__item">
                                        <a
                                            href="#"
                                            class="dropdown-category__link"
                                            >PROGRAMMING</a
                                        >
                                    </li>
                                    <li class="dropdown-category__item">
                                        <a
                                            href="#"
                                            class="dropdown-category__link"
                                            >FRONT-END</a
                                        >
                                    </li>
                                    <li class="dropdown-category__item">
                                        <a
                                            href="#"
                                            class="dropdown-category__link"
                                            >INFRASTRUCTURE</a
                                        >
                                    </li>
                                    <li class="dropdown-category__item">
                                        <a
                                            href="#"
                                            class="dropdown-category__link"
                                            >BUSINESS</a
                                        >
                                    </li>
                                    <li class="dropdown-category__item">
                                        <a
                                            href="#"
                                            class="dropdown-category__link"
                                            >DESIGN & UX</a
                                        >
                                    </li>
                                </ul>
                            </div>
                            <li>
                                <button class="header__button">
                                    FAVORITES
                                </button>
                            </li>
                            <li>
                                <button class="header__button">
                                    MY BOOKSHELF
                                </button>
                            </li>
                        </ul>
                    </nav>
                    <div class="header__icons text--3xl">
                        <button class="header__heart">
                            <span class="icon-font">&#xf003;</span>
                        </button>
                        <button class="header__bag">
                            <span class="icon-font">&#xf000;</span>
                            <div class="header__icon-detail text--rg">
                                My Bag
                            </div>
                        </button>
                        <button class="header__profile">
                            <span class="icon-font">&#xf001;</span>
                            <div class="header__icon-detail text--rg">
                                My Profile
                            </div>
                        </button>
                    </div>
                </div>
            </header>
        </div>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
